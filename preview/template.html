<style>/*LEAFLET_CSS*/.minibar .hush{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.22);flex:none}
.minibar .hush svg{fill:currentColor}
.viewsw { display: flex; gap: 4px; margin: 0 14px 10px; padding: 3px; border-radius: 14px; background: var(--card2); flex: none; }
.viewsw button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 0; border-radius: 11px; font-weight: 800; font-size: 14px; color: var(--muted); }
.viewsw button[aria-selected="true"] { background: var(--card); color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.mapstyle { position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 66px); z-index: 900; display: flex; padding: 3px; gap: 3px; border-radius: 14px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.mapstyle button { display: inline-flex; align-items: center; gap: 4px; padding: 7px 11px; border-radius: 11px; font-weight: 800; font-size: 13px; color: var(--muted); }
.mapstyle button[aria-selected="true"] { background: var(--primary); color: #fff; }
#go .mapstyle { top: calc(env(safe-area-inset-top) + 64px); }
#go.sheet-full .mapstyle { opacity: 0; pointer-events: none; }
.bookpane { position: absolute; inset: 0; overflow: auto; background: #FBF6EC; -webkit-overflow-scrolling: touch; }
.bookimg { margin: 0 auto; padding: 110px 0 var(--sh, 240px); }
.bookimg img { width: 100%; height: auto; display: block; }
.zoombtns { position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 120px); z-index: 900; display: flex; flex-direction: column; gap: 8px; }
.zoombtns .mapbtn { font-size: 22px; font-weight: 800; }
#go .zoombtns { top: auto; left: 12px; right: auto; bottom: calc(var(--sh, 56%) + 60px); flex-direction: row; }
#go.sheet-full .zoombtns { opacity: 0; pointer-events: none; }
.minibar .endx { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.2); flex: none; margin-left: 4px; }
.bookwrap { position: relative; }
.bhit { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 17px; background: transparent; border: 0; padding: 0; }
.bme { position: absolute; width: 2.8%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(26,115,232,.5); border: 1.5px solid rgba(255,255,255,.9); box-shadow: 0 0 0 4px rgba(26,115,232,.18), 0 0 10px 3px rgba(26,115,232,.35); z-index: 3; pointer-events: none; transition: left .6s linear, top .6s linear; }
.overlayctl { position: absolute; left: 12px; right: 70px; top: calc(env(safe-area-inset-top) + 112px); z-index: 900; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 14px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.18); font-size: 13px; font-weight: 800; color: var(--muted); }
.overlayctl input { flex: 1; accent-color: var(--accent); }
#go .overlayctl { top: calc(env(safe-area-inset-top) + 110px); }
#go.sheet-full .overlayctl { opacity: 0; pointer-events: none; }
.bchk { position: absolute; transform: translate(-50%, -50%); min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; background: rgba(214,51,108,.6); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
.pinchk { position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 112px); z-index: 900; padding: 7px 12px; border-radius: 14px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.18); font-size: 13px; font-weight: 800; color: var(--primary); }
.pinchk[aria-pressed="true"] { background: var(--accent); color: #fff; }
#go .pinchk { top: calc(env(safe-area-inset-top) + 110px); }
#go.sheet-full .pinchk { opacity: 0; pointer-events: none; }
#go.sheet-peek .gobody { display: none; }
#go.sheet-peek .nav { margin-bottom: 14px; }
.wprog { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; font-size: 12px; font-weight: 800; color: rgba(255,255,255,.92); }
.wprog .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
.wprog .bar i { display: block; height: 100%; background: #fff; border-radius: 3px; }
.resetw { display: block; margin: 10px auto 0; font-weight: 800; font-size: 14px; color: var(--muted); text-decoration: underline; background: none; }
.mapbtn.on { background: var(--primary); color: #fff; }

<style>
:root {
  /* Lagoon teal, hibiscus pink, plumeria cream, sunset gold, Mānoa green. Layout: phone app shell, tab bar, sheets. */
  --bg: #FFF6E9; --card: #FFFFFF; --card2: #FCEFE0; --text: #1D2B2E; --muted: #5E6B6B; --line: #E8D9C3;
  --primary: #0E6E74; --onprimary: #FFFFFF; --accent: #D6336C; --accentsoft: #F7C6D6; --gold: #F29E4C; --leaf: #3A7D44;
  --dirbg: #E3F3F1; --hl: #FFF0D6; --factbg: #EAF5EC; --factline: #CFE6D4;
  --display: "Libre Caslon Text", Georgia, "Times New Roman", serif; --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1F26; --card: #13303A; --card2: #1A3D48; --text: #F4EFE6; --muted: #9DB4B6; --line: #24505C;
  --primary: #2BA8A4; --onprimary: #04181C; --accent: #FF7AA2; --accentsoft: #5A2236; --gold: #FFB870; --leaf: #7CC08A;
  --dirbg: #103A3E; --hl: #3A2A10; --factbg: #1C3A2C; --factline: #2F5C45; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1F26; --card: #13303A; --card2: #1A3D48; --text: #F4EFE6; --muted: #9DB4B6; --line: #24505C;
  --primary: #2BA8A4; --onprimary: #04181C; --accent: #FF7AA2; --accentsoft: #5A2236; --gold: #FFB870; --leaf: #7CC08A;
  --dirbg: #103A3E; --hl: #3A2A10; --factbg: #1C3A2C; --factline: #2F5C45; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--bg); }
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(150px + env(safe-area-inset-bottom)); background: var(--bg); }
.hidden { display: none !important; }
.screen, .gobody, .modal .panel, .rail, .photos, .maprail { scrollbar-width: none; }
.screen::-webkit-scrollbar, .gobody::-webkit-scrollbar, .modal .panel::-webkit-scrollbar { display: none; }
.pad { padding: 0 18px; }
.label { font: 800 11px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.small { font-size: 14px; color: var(--muted); line-height: 1.35; }
.italic { font-family: var(--display); font-style: italic; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 28px; font-weight: 800; background: var(--primary); color: var(--onprimary); border: 2px solid transparent; }
.btn.accent { background: var(--accent); color: #fff; }
.btn.outline { background: transparent; color: var(--primary); border-color: var(--primary); }
.btn.block { width: 100%; }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.12); flex: none; }
.iconbtn svg, .btn svg { width: 20px; height: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 4px 12px rgba(59,42,18,.06); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 14px; background: var(--card2); font: 700 13px var(--body); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; padding: 3px; border-radius: 22px; background: var(--card2); border: 1px solid var(--line); flex: 1; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 19px; font-weight: 800; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; }
.seg button[aria-selected="true"] { background: var(--card); color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.seg svg { width: 16px; height: 16px; }

/* Home */
.hero { position: relative; height: 360px; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero .fade { position: absolute; inset: 0; background: linear-gradient(rgba(4,30,34,.35), rgba(4,30,34,.1) 50%, var(--bg)); }
.hero .txt { position: absolute; left: 18px; right: 18px; bottom: 6px; }
.hero h1 { font-size: 44px; line-height: 1; }
.hero .sub { font-family: var(--display); letter-spacing: .2em; font-size: 15px; margin-top: 6px; }
.flower { position: absolute; pointer-events: none; }
.startcard { display: flex; align-items: center; gap: 12px; padding: 18px; border-radius: 22px; background: var(--primary); color: var(--onprimary); text-align: left; width: 100%; }
.startcard h3 { font-size: 22px; margin: 2px 0; }
.fact { position: relative; overflow: hidden; border-radius: 20px; padding: 16px 70px 16px 16px; background: var(--factbg); border: 1px solid var(--factline); text-align: left; width: 100%; min-height: 120px; }
.fact .ftxt { font-family: var(--display); font-style: italic; font-size: 16px; line-height: 1.45; transition: opacity .25s; }
.group h2 { font-size: 22px; }
.wave { display: block; margin-top: 2px; }
.rail { display: flex; gap: 14px; overflow-x: auto; padding: 4px 18px 6px; margin: 0 -18px; scroll-snap-type: x mandatory; }
.rail::-webkit-scrollbar { display: none; }
.wcard { position: relative; flex: none; width: 218px; height: 268px; border-radius: 22px; overflow: hidden; scroll-snap-align: start; text-align: left; color: #fff; background: #0E6E74; }
.wcard.wide { width: 100%; height: 220px; }
.wcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wcard .shade { position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(5,25,28,.25), rgba(5,25,28,.9)); }
.wcard .meta { position: absolute; left: 14px; right: 14px; bottom: 14px; }
.wcard h3 { font-size: 20px; line-height: 1.15; }
.wcard .theme { font-family: var(--display); font-style: italic; font-size: 13px; color: #E9F4F2; margin-top: 4px; }
.wcard .stats { font-size: 12px; font-weight: 700; color: #CFE3E0; margin-top: 6px; }
.badge { position: absolute; top: 12px; left: 12px; min-width: 38px; height: 30px; padding: 0 9px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-family: var(--display); color: #fff; }
.pill { position: absolute; top: 14px; right: 12px; padding: 4px 9px; border-radius: 12px; font: 800 11px var(--body); }

/* Walk */
.whero { position: relative; height: 300px; }
.whero img { width: 100%; height: 100%; object-fit: cover; }
.whero .fade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.35), transparent 40%, var(--bg)); }
.topbar { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px); display: flex; align-items: center; gap: 10px; z-index: 900; }
.wtitle { margin-top: -64px; position: relative; }
.wtitle h1 { font-size: 34px; line-height: 1.1; }
.romanchip { align-self: flex-start; padding: 5px 12px; border-radius: 14px; color: #fff; font-family: var(--display); }
.stop { padding-top: 26px; scroll-margin-top: 70px; }
.stophead { display: flex; gap: 12px; align-items: center; }
.num { width: 36px; height: 36px; border-radius: 18px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; }
.stophead h2 { font-size: 22px; line-height: 1.2; }
.actions { display: flex; gap: 8px; }
.action { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 18px; background: var(--card2); font-weight: 700; font-size: 14px; }
.action svg { width: 18px; height: 18px; color: var(--primary); }
.photos { display: flex; gap: 10px; overflow-x: auto; margin-right: -18px; padding-right: 18px; }
.photos::-webkit-scrollbar { display: none; }
.photos img { height: 170px; border-radius: 16px; flex: none; object-fit: cover; max-width: 290px; background: var(--card2); }
.p { font-size: calc(17px * var(--ts, 1)); line-height: 1.6; margin: 0; }
.p.reading { background: var(--hl); border-radius: 10px; margin: 0 -8px; padding: 2px 8px; }
.dir { display: flex; gap: 10px; padding: 14px; border-radius: 16px; background: var(--dirbg); font-weight: 700; font-size: calc(16px * var(--ts, 1)); line-height: 1.45; border: 2px solid transparent; }
.dir.reading { border-color: var(--gold); }
.dir svg { flex: none; width: 20px; height: 20px; color: var(--primary); margin-top: 2px; }
.info { display: flex; gap: 8px; padding: 12px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); font-size: 14px; }
.gw { color: var(--primary); text-decoration: underline dotted; cursor: pointer; }
.lock { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 18px; background: var(--card2); border: 1px solid var(--line); width: 100%; text-align: left; }
.cta { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 18px calc(14px + env(safe-area-inset-bottom)); display: flex; z-index: 950; }
.cta.solid { background: linear-gradient(transparent, var(--bg) 30%); }
.map { position: absolute; inset: 0; background: #AAD3DF; }
.leaflet-container { font-family: var(--body); background: #AAD3DF; }
:root[data-theme="dark"] .map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); } }
.pin { min-width: 28px; height: 28px; padding: 0 5px; border-radius: 14px; border: 2px solid #fff; color: #fff; font: 800 12px var(--body); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.pin.cur { transform: scale(1.25); }
.me { position: relative; width: 18px; height: 18px; border-radius: 9px; background: #1A73E8; border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(26,115,232,.2); }
.me .cone { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin-left: -14px; margin-top: -40px; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 34px solid rgba(26,115,232,.28); transform-origin: 14px 40px; }
.mapbtn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.mapbtn svg { width: 22px; height: 22px; }
.mapbtn.on { color: #1A73E8; }
.maprail { position: absolute; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom)); display: flex; gap: 12px; overflow-x: auto; padding: 0 11%; scroll-snap-type: x mandatory; z-index: 900; }
.maprail::-webkit-scrollbar { display: none; }
.mcard { flex: none; width: 78%; scroll-snap-align: center; display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 20px; background: var(--card); border: 2px solid var(--line); text-align: left; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
.mcard.on { border-color: var(--accent); }
.mcard img, .mcard .ph { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; flex: none; display: flex; align-items: center; justify-content: center; }
.attrib { position: absolute; right: 4px; bottom: 2px; font-size: 10px; color: #333; background: rgba(255,255,255,.7); padding: 0 4px; border-radius: 4px; z-index: 800; }

/* Active walk */
#go .mapwrap { position: absolute; inset: 0; }
.gohead { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px); display: flex; gap: 10px; align-items: center; z-index: 1000; }
.gopill { flex: 1; text-align: center; background: var(--card); border-radius: 18px; padding: 6px 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); min-width: 0; }
.gopill div:last-child { font-family: var(--display); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 56%; background: var(--bg); border-radius: 24px 24px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.16); display: flex; flex-direction: column; z-index: 950; touch-action: none; }
.sheet.anim { transition: height .28s cubic-bezier(.2,.8,.2,1); }
.sheet .gobody { touch-action: pan-y; }
.grab { display: flex; justify-content: center; padding: 9px 0 5px; cursor: grab; flex: none; }
.handle { width: 40px; height: 5px; border-radius: 3px; background: var(--line); background: color-mix(in srgb, var(--text) 25%, transparent); }
.pager { position: absolute; left: 0; right: 0; bottom: 0; z-index: 950; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.pager.inline { position: static; border: 0; padding: 0 14px 8px; flex: none; background: transparent; }
.pbtn { display: inline-flex; align-items: center; gap: 4px; padding: 9px 14px; border-radius: 14px; background: var(--card2); color: var(--primary); font-weight: 800; font-size: 15px; }
.pbtn svg { width: 18px; height: 18px; }
.pbtn[disabled] { opacity: .35; }
.pcount { font-weight: 800; color: var(--muted); font-size: 14px; }
.stoprow { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: left; width: 100%; }
.stoprow .srt { font-weight: 800; font-size: 16px; line-height: 1.3; }
.srmark { flex: none; display: inline-flex; }
.page.from-r { animation: fromR .22s ease-out; }
.page.from-l { animation: fromL .22s ease-out; }
@keyframes fromR { from { transform: translateX(36px); opacity: .2; } }
@keyframes fromL { from { transform: translateX(-36px); opacity: .2; } }
.simtoggle { position: absolute; left: 12px; bottom: calc(var(--sh, 56%) + 12px); z-index: 1000; transition: opacity .2s; }
#go.sheet-full .simtoggle, #go.sheet-full .simbar { opacity: 0; pointer-events: none; }
.simbar { transition: opacity .2s; }
.nav { flex: none; display: flex; gap: 12px; align-items: center; margin: 0 14px; padding: 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.nav.here { background: color-mix(in srgb, var(--leaf) 16%, var(--card)); }
.nav .arrow { width: 32px; height: 32px; flex: none; color: var(--accent); transition: transform .3s; }
.nav h3 { font-family: var(--body); font-weight: 800; font-size: 18px; line-height: 1.25; }
#go .p { font-size: calc(18px * var(--ts, 1)); line-height: 1.65; }
#go .dir { font-size: calc(17px * var(--ts, 1)); }
.gobody { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 28px; border-top: 1px solid var(--line); margin-top: 12px; display: flex; flex-direction: column; gap: 14px; }
.controls { display: flex; gap: 12px; align-items: center; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
.play { width: 52px; height: 52px; border-radius: 26px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.play svg { width: 24px; height: 24px; }
.arrived { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 66px); z-index: 1100; display: flex; gap: 10px; align-items: center; padding: 14px; border-radius: 18px; background: var(--leaf); color: #fff; font-weight: 800; box-shadow: 0 6px 16px rgba(0,0,0,.25); animation: drop .4s ease-out; }
@keyframes drop { from { transform: translateY(-24px); opacity: 0; } }
.simbar { position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 66px); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
.simtoggle { padding: 8px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.simtoggle[aria-pressed="true"] { background: var(--gold); color: #2a1800; }

/* Tabs and floating bar */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 6px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 1200; }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 700 11px var(--body); color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--accent); }
.tabs svg { width: 24px; height: 24px; }
